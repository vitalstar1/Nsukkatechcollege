
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login | Nsukka Technical College</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #071a35;
    color: #d9efff;
    font-family: Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 22px;
}

.panel {
    width: min(100%, 420px);
    background: #0d2a50;
    border: 1px solid #258bd0;
    border-radius: 16px;
    padding: 26px;
    box-shadow: 0 12px 35px #0005;
}

h1 {
    color: #75caff;
    text-align: center;
    margin: 0 0 8px;
}

p {
    text-align: center;
    color: #b9dfff;
}

label {
    display: block;
    margin: 15px 0 6px;
}

input[type="email"],
input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #397eae;
    border-radius: 8px;
    background: #061a33;
    color: white;
    font-size: 16px;
}

.password-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: #b9dfff;
    font-size: 14px;
}

.password-toggle input {
    accent-color: #42b4f5;
    width: 17px;
    height: 17px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    border: 0;
    border-radius: 8px;
    background: #42b4f5;
    color: #061a33;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

a {
    color: #75caff;
}

.message {
    text-align: center;
    min-height: 22px;
    margin-top: 12px;
    color: #ffd38a;
}

.loading {
    display: none;
    text-align: center;
    color: #75caff;
    margin-top: 15px;
    font-size: 14px;
}

.loading.show {
    display: block;
}

.spinner {
    display: inline-block;
    width: 17px;
    height: 17px;
    border: 3px solid #24527c;
    border-top-color: #42b4f5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 7px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<main class="panel">

    <h1>Student Login</h1>
    <p>Nsukka Technical College</p>

    <form id="loginForm">

        <label for="email">Email address</label>
        <input
            id="email"
            type="email"
            required
            autocomplete="username"
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
        >

        <label class="password-toggle">
            <input type="checkbox" id="showPassword">
            Show password
        </label>

        <button id="loginButton" type="submit">
            Log in
        </button>

    </form>

    <div class="loading" id="loading">
        <span class="spinner"></span>
        Logging in, please wait...
    </div>

    <div class="message" id="message" role="status"></div>

    <p>
        New student?
        <a href="register.html">Create an account</a>
    </p>

</main>

<script type="module">

import { auth, persistenceReady } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");
const loading = document.getElementById("loading");
const password = document.getElementById("password");
const showPassword = document.getElementById("showPassword");

showPassword.addEventListener("change", () => {
    password.type = showPassword.checked ? "text" : "password";
});

try {
    await persistenceReady;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.replace("index.html");
        }
    });

} catch (error) {
    message.textContent = "Could not initialize login. Please refresh.";
}

if (new URLSearchParams(location.search).get("registered") === "1") {
    message.textContent = "Registration successful. You can now log in.";
}

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Logging in...";
    loading.classList.add("show");

    try {

        await persistenceReady;

        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim().toLowerCase(),
            password.value
        );

        message.textContent = "Login successful!";

        window.location.replace("socialhub.html");

    } catch (error) {

        message.textContent =
            error.code === "auth/invalid-credential" ||
            error.code === "auth/user-not-found" ||
            error.code === "auth/wrong-password"
            ? "Incorrect email or password."
            : "Login failed. Please check your connection and try again.";

        button.disabled = false;
        button.textContent = "Log in";
        loading.classList.remove("show");

    }

});

</script>

</body>
</html>
