
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Social Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #06152e;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

h1 {
    color: #38bdf8;
    font-size: 27px;
    margin-bottom: 10px;
}

.subtitle {
    color: #87cefa;
    font-size: 14px;
    margin-bottom: 30px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.class-btn {
    background: #10294b;
    border: 1px solid #38bdf8;
    border-radius: 12px;
    padding: 22px 10px;
    color: #38bdf8;
    font-size: 19px;
    font-weight: bold;
    text-decoration: none;
    display: block;
}

.class-btn:active {
    background: #17436b;
}

footer {
    color: #6daed0;
    font-size: 12px;
    margin-top: 35px;
}
</style>
</head>

<body>

<div class="container">

    <h1>School Social Hub</h1>
    <p class="subtitle">Choose your class to continue</p>

    

<div class="buttons">

    <a href="jss1.html" class="class-btn">JSS 1</a>
    <a href="ss1.html" class="class-btn">SS 1</a>

    <a href="jss2.html" class="class-btn">JSS 2</a>
    <a href="ss2.html" class="class-btn">SS 2</a>

    <a href="jss3.html" class="class-btn">JSS 3</a>
    <a href="ss3.html" class="class-btn">SS 3</a>

</div>


    

    <footer>
        © 2026 School Social Hub
    </footer>

</div>

</body>
</html>
